<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Beyaz Yuvarlak Zemin -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Kırmızı Çatı Çizgisi -->
  <polyline points="20,40 50,18 80,40" fill="none" stroke="#D0021B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- CASA Tipografisi -->
  <text x="50" y="62" font-family="'Times New Roman', Times, serif" font-size="24" font-weight="bold" fill="#1E293B" text-anchor="middle" letter-spacing="1">CASA</text>
  
  <!-- Kırmızı Ayırıcı Çizgiler & HOME -->
  <line x1="22" y1="70" x2="33" y2="70" stroke="#D0021B" stroke-width="1.8"/>
  <text x="50" y="73" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="bold" fill="#1E293B" text-anchor="middle" letter-spacing="2">HOME</text>
  <line x1="67" y1="70" x2="78" y2="70" stroke="#D0021B" stroke-width="1.8"/>
  
  <!-- MUTFAK & BANYO Alt Metni -->
  <text x="50" y="83" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.2">MUTFAK &amp; BANYO</text>
</svg>
